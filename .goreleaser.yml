version: 2

project_name: ai-token-exporter

builds:
  - id: ai-token-exporter
    main: ./cmd/ai-token-exporter
    binary: ai-token-exporter
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
      - -buildvcs=true
    ldflags:
      - -s -w
      - -X 'main.version={{.Tag}}'
      - -X 'main.commit={{.FullCommit}}'
      - -X 'github.com/jimmicro/version.GitTag={{.Tag}}'
      - -X 'github.com/jimmicro/version.BuildTime={{.Date}}'
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: default
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    files:
      - none*

dockers_v2:
  - id: ai-token-exporter
    ids:
      - ai-token-exporter
    platforms:
      - linux/amd64
      - linux/arm64
    images:
      - "ghcr.io/jimyag/ai-token-exporter"
    tags:
      - "{{ .Tag }}"
      - "latest"
    dockerfile: Dockerfile.release
    sbom: none
    labels:
      org.opencontainers.image.created: "{{.Date}}"
      org.opencontainers.image.title: "{{.ProjectName}}"
      org.opencontainers.image.revision: "{{.FullCommit}}"
      org.opencontainers.image.version: "{{.Tag}}"

release:
  github:
    owner: jimyag
    name: ai-token-exporter
  mode: replace
  extra_files:
    - glob: ./dashboard/ai-token-exporter.json
      name_template: ai-token-exporter-dashboard.json

changelog:
  use: github-native
