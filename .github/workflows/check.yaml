name: Check

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ github.token }}
      - name: Test
        run: task test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: arduino/setup-task@v3
        with:
          repo-token: ${{ github.token }}
      - name: Build
        run: task build
      - name: Check dashboard JSON
        run: jq empty dashboard/*.json
      - name: Check GoReleaser config
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: check
      - name: Build release archives
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean --skip=docker
      - name: Verify release archive contents
        run: |
          for archive in dist/*.tar.gz; do
            echo "checking $archive"
            if tar -tzf "$archive" | grep -E '(^|/)(README|LICENSE)|dashboard/'; then
              echo "$archive contains non-binary release files"
              exit 1
            fi
            test "$(tar -tzf "$archive" | wc -l | tr -d ' ')" = "1"
          done
          for archive in dist/*.zip; do
            echo "checking $archive"
            if unzip -Z1 "$archive" | grep -E '(^|/)(README|LICENSE)|dashboard/'; then
              echo "$archive contains non-binary release files"
              exit 1
            fi
            test "$(unzip -Z1 "$archive" | wc -l | tr -d ' ')" = "1"
          done
